[package]
name = "stake_sync"
version = "0.1.0"
description = "Stake-Sync commitment challenge escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stake_sync"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.1", features = ["token", "token_2022", "associated_token"] }

[dev-dependencies]
litesvm = "0.17.0"
litesvm-token = "0.17.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-address = "2.7"
solana-clock = "3.2"
solana-account = "4.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
